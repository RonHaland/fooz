name: build and deploy
on:
  workflow_call:
    inputs:
      environment:
        description: "DEV | TEST | PROD"
        type: string
        required: true
        default: "DEV"

env:
  ENVIRONMENT: ${{ inputs.environment }}
  ENVIRONMENT_LOWER: ""
  BASE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
  STORAGE_CONNECTION_STRING: ""
  STORAGE_IP: ""
  SERVER_IP: api.ronha.land
  DEV_PORT: 8380
  TEST_PORT: 8480
  PROD_PORT: 8580
  DEV_STORAGE_PORT: 10010
  TEST_STORAGE_PORT: 10020
  PROD_STORAGE_PORT: 10000

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: set lowercase Environment variable
        run: |
          UPPERCASE_VALUE="${{ env.ENVIRONMENT }}"
          LOWERCASE_VALUE=$(echo "$UPPERCASE_VALUE" | tr '[:upper:]' '[:lower:]')
          echo "ENVIRONMENT_LOWER=$LOWERCASE_VALUE" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: create ssh key on agent
        run: |
          mkdir ./.ssh
          touch ./.ssh/rsa_key
          echo "${{ secrets.SSH_KEY }}" > ./.ssh/rsa_key
          chmod 600 ./.ssh/rsa_key

      - name: copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} "mkdir -p ./temp/${{ env.ENVIRONMENT_LOWER }}"
          scp -o StrictHostKeyChecking=no -i ./.ssh/rsa_key -r ./foozApi ./nginx ronny@${{ env.SERVER_IP }}:./temp/${{ env.ENVIRONMENT_LOWER }}/

      - name: copy nginx configs
        run: |
          ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} "
            sudo cp temp/${{ env.ENVIRONMENT_LOWER }}/nginx/*.conf /etc/nginx/sites-available/ && \
            sudo nginx -t && \
            sudo systemctl reload nginx
          "

      - name: configure network
        run: |
          ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} "
            sudo docker network inspect ${{ env.ENVIRONMENT_LOWER }}-fooz-net || \
              sudo docker network create ${{ env.ENVIRONMENT_LOWER }}-fooz-net
          "

      - name: configure storage
        env:
          STORAGE_PORT: ${{ env[format('{0}_STORAGE_PORT', inputs.environment)] }}
        run: |
          echo "STORAGE_IP=$(ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} 'bash -s' << 'EOF'
            set -euxo pipefail  
            Local_env=${{ env.ENVIRONMENT_LOWER }}
            STORAGE_PORT=${{ env.STORAGE_PORT }}
            BLOB_PORT=$(($STORAGE_PORT + 0))
            QUEUE_PORT=$(($STORAGE_PORT + 1))
            TABLE_PORT=$(($STORAGE_PORT + 2))
            mkdir -p storage/$Local_env
            echo "setting up storage for $Local_env using ports($BLOB_PORT $QUEUE_PORT $TABLE_PORT) based on port $STORAGE_PORT" >&2
            sudo docker container inspect ${Local_env}foozazurite >/dev/null 2>&1 || \
              (sudo docker pull mcr.microsoft.com/azure-storage/azurite >&2 && \
              sudo docker run -d \
                --name ${Local_env}foozazurite \
                --restart unless-stopped \
                --network ${Local_env}-fooz-net \
                -v /home/ronny/storage/${Local_env}:/data \
                -p $BLOB_PORT:$BLOB_PORT \
                -p $QUEUE_PORT:$QUEUE_PORT \
                -p $TABLE_PORT:$TABLE_PORT \
                mcr.microsoft.com/azure-storage/azurite \
                azurite -l /data --blobPort $BLOB_PORT --queuePort $QUEUE_PORT --tablePort $TABLE_PORT \
                --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 >/dev/null 2>&1)
            STORAGE_IP=$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${Local_env}foozazurite)
            echo "$STORAGE_IP"
          EOF
          )" >> $GITHUB_ENV

      - name: set storage connection string
        env:
          STORAGE_PORT: ${{ env[format('{0}_STORAGE_PORT', inputs.environment)] }}
        run: |
          Local_env=${{ env.ENVIRONMENT_LOWER }}
          STORAGE_PORT=${{ env.STORAGE_PORT }}
          BLOB_PORT=$(($STORAGE_PORT + 0))
          QUEUE_PORT=$(($STORAGE_PORT + 1))
          TABLE_PORT=$(($STORAGE_PORT + 2))
          BLOB_ENDPOINT="BlobEndpoint=http://${{ env.STORAGE_IP }}:${BLOB_PORT}/devstoreaccount1;"
          QUEUE_ENDPOINT="QueueEndpoint=http://${{ env.STORAGE_IP }}:${QUEUE_PORT}/devstoreaccount1;"
          TABLE_ENDPOINT="TableEndpoint=http://${{ env.STORAGE_IP }}:${TABLE_PORT}/devstoreaccount1;"
          CONNECTION_STRING="${{env.BASE_CONNECTION_STRING}}${BLOB_ENDPOINT}${QUEUE_ENDPOINT}${TABLE_ENDPOINT}"
          echo "STORAGE_CONNECTION_STRING=$CONNECTION_STRING" >> $GITHUB_ENV

      - name: build docker file
        env:
          HTTP_PORT: ${{ env[format('{0}_PORT', inputs.environment)] }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} << 'EOF'
            Local_env=${{ env.ENVIRONMENT_LOWER }}
            cd temp/$Local_env/foozApi/foozApi
            sudo docker build --build-arg HTTP_PORT=${{ env.HTTP_PORT }} -t ${Local_env}foozapi .
            sudo docker stop ${Local_env}foozapi
            sudo docker container rm ${Local_env}foozapi
            sudo docker run -d \
              --name ${Local_env}foozapi \
              --restart unless-stopped \
              --network ${Local_env}-fooz-net \
              -p ${{ env.HTTP_PORT }}:${{ env.HTTP_PORT }} \
              -e "ConnectionStrings__StorageAccount"="${{ env.STORAGE_CONNECTION_STRING }}" \
              -e Environment="${{ env.ENVIRONMENT }}" \
              ${Local_env}foozapi
            exit 
            EOF

      - name: clean up files
        run: |
          ssh -o StrictHostKeyChecking=no -i ./.ssh/rsa_key ronny@${{ env.SERVER_IP }} "sudo rm -r temp/${{ env.ENVIRONMENT_LOWER }}"

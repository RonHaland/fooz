server {
    listen 443 ssl;
    server_name foozball.win www.foozball.win;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/devapi.ronha.land/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devapi.ronha.land/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!RC4:!aNULL:!eNULL:!MD5:!DES:!3DES:!DSS:!AES128:!AES256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "no-referrer-when-downgrade";

    location / {
        # Proxy to PROD client on port 8581
        proxy_pass http://localhost:8581;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}

server {
    listen 80;
    server_name foozball.win www.foozball.win;
    return 301 https://$server_name$request_uri;
}

